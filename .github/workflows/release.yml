# Publish a Plugin Release on a tag `vMAJOR.MINOR.PATCH` (FirstMate ADR-0033).
# FirstMate's reusable workflow tests, builds with `node build.ts` into
# release/, archives it and uploads it. It is called at @main because a called
# workflow cannot find its own ref; it exists once FirstMate PR #253 is on main.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: luanAfons0/FirstMate/.github/workflows/plugin-release.yml@main
    # The workflow creates the GitHub Release, so it needs this, and nothing more.
    permissions:
      contents: write
    with:
      test: npm ci && npm run check
      build: npm run build
